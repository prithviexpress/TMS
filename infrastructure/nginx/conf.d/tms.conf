# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=auth:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=sensor:10m rate=600r/m;

# All 9 service upstreams — loopback only (services bind to 127.0.0.1)
upstream gate_service         { server 127.0.0.1:8001; keepalive 4; }
upstream bay_service          { server 127.0.0.1:8002; keepalive 4; }
upstream schedule_service     { server 127.0.0.1:8003; keepalive 4; }
upstream vendor_service       { server 127.0.0.1:8004; keepalive 4; }
upstream notif_service        { server 127.0.0.1:8005; keepalive 4; }
upstream display_service      { server 127.0.0.1:8006; keepalive 4; }
upstream auth_service         { server 127.0.0.1:8007; keepalive 4; }
upstream device_service       { server 127.0.0.1:8008; keepalive 4; }
upstream config_service       { server 127.0.0.1:8009; keepalive 4; }

server {
    listen 80;
    server_name _;

    client_max_body_size 50M;

    # Common proxy headers — defined once, applied per location
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";  # keepalive

    # ------------------------------------------------------------------ #
    # Auth — stricter rate limit                                          #
    # ------------------------------------------------------------------ #
    location /api/v1/auth/ {
        limit_req zone=auth burst=10 nodelay;
        proxy_pass http://auth_service;
    }

    # ------------------------------------------------------------------ #
    # Gate service                                                        #
    # ------------------------------------------------------------------ #
    location /api/v1/gate/ {
        limit_req zone=api burst=30 nodelay;
        proxy_pass http://gate_service;
    }

    # ------------------------------------------------------------------ #
    # Bay service                                                         #
    # SSE stream: no buffering, long timeout                             #
    # Sensor ingest: higher burst for LoRaWAN uplinks                   #
    # ------------------------------------------------------------------ #
    location /api/v1/bays/events/stream {
        proxy_pass http://bay_service;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_set_header Connection "";
    }

    location /api/v1/bays/sensor/ {
        limit_req zone=sensor burst=200 nodelay;
        proxy_pass http://bay_service;
    }

    location /api/v1/bays/ {
        limit_req zone=api burst=30 nodelay;
        proxy_pass http://bay_service;
    }

    # ------------------------------------------------------------------ #
    # Schedule service                                                    #
    # Nagare upload: extended timeout for large Excel files              #
    # ------------------------------------------------------------------ #
    location /api/v1/schedule/nagare {
        limit_req zone=api burst=5 nodelay;
        proxy_pass http://schedule_service;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        client_max_body_size 50M;
    }

    location /api/v1/schedule/ {
        limit_req zone=api burst=30 nodelay;
        proxy_pass http://schedule_service;
    }

    # ------------------------------------------------------------------ #
    # Vendor service                                                      #
    # ------------------------------------------------------------------ #
    location /api/v1/vendors/ {
        limit_req zone=api burst=30 nodelay;
        proxy_pass http://vendor_service;
    }

    # ------------------------------------------------------------------ #
    # Notification service                                                #
    # ------------------------------------------------------------------ #
    location /api/v1/notifications/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://notif_service;
    }

    # ------------------------------------------------------------------ #
    # Display service                                                     #
    # ------------------------------------------------------------------ #
    location /api/v1/display/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://display_service;
    }

    # ------------------------------------------------------------------ #
    # Device service — higher limit for ALPR/sensor API keys             #
    # ------------------------------------------------------------------ #
    location /api/v1/devices/ {
        limit_req zone=sensor burst=100 nodelay;
        proxy_pass http://device_service;
    }

    # ------------------------------------------------------------------ #
    # Config service                                                      #
    # ------------------------------------------------------------------ #
    location /api/v1/config/ {
        limit_req zone=api burst=10 nodelay;
        proxy_pass http://config_service;
    }

    # ------------------------------------------------------------------ #
    # Health check (no rate limit — used by supervisord + monitoring)    #
    # ------------------------------------------------------------------ #
    location /health {
        return 200 '{"status":"ok"}';
        add_header Content-Type application/json;
    }
}
