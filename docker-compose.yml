version: "3.9"

services:

  # ────────────────────────────────────────────────────────────────
  # Infrastructure
  # ────────────────────────────────────────────────────────────────

  nats:
    image: nats:2.10-alpine
    command: ["-c", "/etc/nats/nats-server.conf", "--js"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - ./infrastructure/nats/nats-server.conf:/etc/nats/nats-server.conf:ro
      - nats_data:/data/jetstream
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nats-server", "--help"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tms
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tms"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server /etc/redis/redis.conf
    ports:
      - "6379:6379"
    volumes:
      - ./infrastructure/redis/redis.conf:/etc/redis/redis.conf:ro
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
    volumes:
      - ./infrastructure/minio/init-buckets.sh:/init-buckets.sh:ro
    entrypoint: ["/bin/sh", "/init-buckets.sh"]
    restart: "no"

  nginx:
    image: nginx:1.25-alpine
    ports:
      - "80:80"
    volumes:
      - ./infrastructure/nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - gate-service
      - bay-service
      - schedule-service
      - vendor-service
      - notification-service
      - display-service
      - auth-service
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infrastructure/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    restart: unless-stopped

  # ────────────────────────────────────────────────────────────────
  # Microservices
  # ────────────────────────────────────────────────────────────────

  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://tms:${POSTGRES_PASSWORD}@postgres:5432/tms_auth
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      REFRESH_TOKEN_EXPIRE_DAYS: 7
    ports:
      - "8007:8007"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8007/api/v1/auth/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  schedule-service:
    build:
      context: .
      dockerfile: services/schedule-service/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://tms:${POSTGRES_PASSWORD}@postgres:5432/tms_schedule
      NATS_URL: nats://nats:4222
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_USER}
      MINIO_SECRET_KEY: ${MINIO_PASSWORD}
      MINIO_BUCKET_NAGARE: nagare-uploads
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "8003:8003"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/api/v1/schedule/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  bay-service:
    build:
      context: .
      dockerfile: services/bay-service/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://tms:${POSTGRES_PASSWORD}@postgres:5432/tms_bay
      NATS_URL: nats://nats:4222
      REDIS_URL: redis://redis:6379/0
      DISPLAY_SERVICE_URL: http://display-service:8006
      LORAWAN_INGEST_API_KEY: ${LORAWAN_INGEST_API_KEY}
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "8002:8002"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/api/v1/bays/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  gate-service:
    build:
      context: .
      dockerfile: services/gate-service/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://tms:${POSTGRES_PASSWORD}@postgres:5432/tms_gate
      NATS_URL: nats://nats:4222
      SCHEDULE_SERVICE_URL: http://schedule-service:8003
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_USER}
      MINIO_SECRET_KEY: ${MINIO_PASSWORD}
      MINIO_BUCKET_ALPR: alpr-images
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      schedule-service:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/api/v1/gate/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  display-service:
    build:
      context: .
      dockerfile: services/display-service/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://tms:${POSTGRES_PASSWORD}@postgres:5432/tms_display
      NATS_URL: nats://nats:4222
      K70_GATEWAY_IP: ${K70_GATEWAY_IP:-192.168.10.50}
      LED_DISPLAY_GATE2_IP: ${LED_DISPLAY_GATE2_IP:-192.168.10.51}
      LED_DISPLAY_PARKING_EXIT_IP: ${LED_DISPLAY_PARKING_EXIT_IP:-192.168.10.52}
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "8006:8006"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8006/api/v1/display/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  notification-service:
    build:
      context: ./services/notification-service
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://tms:${POSTGRES_PASSWORD}@postgres:5432/tms_notifications
      NATS_URL: nats://nats:4222
      MSG91_AUTH_KEY: ${MSG91_AUTH_KEY:-}
      MSG91_SENDER_ID: ${MSG91_SENDER_ID:-MSILTM}
      WHATSAPP_API_TOKEN: ${WHATSAPP_API_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "8005:8005"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8005/api/v1/notifications/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  vendor-service:
    build:
      context: ./services/vendor-service
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://tms:${POSTGRES_PASSWORD}@postgres:5432/tms_vendor
      NATS_URL: nats://nats:4222
      SCHEDULE_SERVICE_URL: http://schedule-service:8003
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "8004:8004"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      schedule-service:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8004/api/v1/vendors/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  pgdata:
  redis_data:
  nats_data:
  minio_data:
  prometheus_data:
  grafana_data:
