[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tms-shared"
version = "0.1.0"
dependencies = [
    "pydantic>=2.0",
    "nats-py>=2.6",
    "python-jose[cryptography]>=3.3",
    "fastapi>=0.111",
]

[tool.hatch.build.targets.wheel]
packages = ["tms_shared"]
